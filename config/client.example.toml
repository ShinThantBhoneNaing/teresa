# TERESA client configuration — lives at ~/.config/teresa/config.toml
# (written with defaults on first run; this file documents every key).

server = "127.0.0.1"       # hostname or IP of your teresad
port = 7737
tls = false                # true => https/wss, verified against system roots

theme = "matrix"           # matrix | cyberpunk | whoami | dracula | nord
                           # gruvbox | catppuccin   (also: /theme <name>)

notifications = true       # master switch
bell = true                # terminal bell on mentions and DMs
title_flash = true         # ● in the terminal title on unseen activity
typing_indicators = true   # show (and send) "is typing"
clock_24h = true

# Troubleshooting log (the TUI owns the terminal, so logs go to a file).
#log_file = "/tmp/teresa.log"
